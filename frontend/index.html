<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PSN Raffle LMS - Premium Raffle and Lottery Management System" />
    <meta name="keywords" content="raffle, lottery, management, system, psn, draw" />
    <meta name="author" content="Saad Akhtar" />
    <title>PSN Raffle | Premium LMS</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="screen">
      <!-- PRIZE -->
      <div class="prize">Prize: ...</div>

      <!-- NUMBER BOX -->
      <div class="numberBox">
        <div class="digits">
          <div class="digit">0</div>
          <div class="digit">0</div>
          <div class="digit">0</div>
          <div class="digit">0</div>
          <div class="digit">0</div>
        </div>
      </div>

      <!-- WINNER -->
      <div class="winner" id="winnerName"></div>

      <!-- DRAW BUTTONS -->
      <div class="draw-container">
        <button class="btn btn-draw" onclick="startDraw()">DRAW</button>
      </div>

      <!-- MANAGEMENT WRAPPER -->
      <div class="management-wrapper">
        <div class="control-box glass-module">
          <div class="checkbox">
            <input type="checkbox" id="remove-name-cb" checked />
            <span>Remove Name on next draw</span>
          </div>

          <div class="bottomButtons">
            <button class="btn btn-save" onclick="saveResult()">SAVE</button>
          </div>
        </div>
      </div>

      <!-- TIME -->
      <div class="time" id="time"></div>
    </div>

    <script src="script.js"></script>
</body>
  
</html>
